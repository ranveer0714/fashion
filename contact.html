<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Kalaah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="contact">
    <div data-site-header></div>
    <main>
      <section class="page-intro contact-intro">
        <p class="eyebrow">We would love to hear from you</p>
        <h1>Visit the studio<br /><em>or leave a note.</em></h1>
      </section>
      <section class="contact-layout section">
        <form class="contact-form form-card" novalidate>
          <div class="field-row">
            <label>Name<input name="name" required /></label
            ><label>Email<input type="email" name="email" required /></label>
          </div>
          <label>Subject<input name="subject" required /></label
          ><label
            >Message<textarea
              name="message"
              rows="6"
              required
            ></textarea></label
          ><button class="btn btn-dark" type="submit">Send message</button>
          <p class="form-message"></p>
        </form>
        <aside class="contact-details">
          <article>
            <i class="fa-solid fa-location-dot"></i>
            <div>
              <h3>The Kalaah Studio</h3>
              <p>
                18, Turner Road, Bandra West<br />Mumbai, Maharashtra 400050
              </p>
            </div>
          </article>
          <article>
            <i class="fa-solid fa-phone"></i>
            <div>
              <h3>Call us</h3>
              <p>+91 22 4962 8890<br />Monday - Saturday, 10am - 7pm</p>
            </div>
          </article>
          <article>
            <i class="fa-solid fa-envelope"></i>
            <div>
              <h3>Write to us</h3>
              <p>hello@kalaahstudio.com<br />care@kalaahstudio.com</p>
            </div>
          </article>
          <div class="social-row">
            <a href="#" aria-label="Instagram"
              ><i class="fa-brands fa-instagram"></i></a
            ><a href="#" aria-label="Pinterest"
              ><i class="fa-brands fa-pinterest-p"></i></a
            ><a href="#" aria-label="Facebook"
              ><i class="fa-brands fa-facebook-f"></i
            ></a>
          </div>
        </aside>
      </section>
      <section class="map">
        <iframe
          title="Kalaah Studio location"
          src="https://www.google.com/maps?q=Bandra%20West%20Mumbai&output=embed"
          loading="lazy"
        ></iframe>
      </section>
    </main>
    <div data-site-footer></div>
    <div data-modal></div>
    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Kalaah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="forgot" class="auth-page">
    <main class="auth-layout">
      <a
        class="auth-brand"
        href="index.html"
        aria-label="Kalaah Fashion Studio home"
        ><img
          class="brand-logo"
          src="images/kalaah-logo.svg"
          alt="Kalaah Fashion Studio"
      /></a>
      <div class="auth-image"></div>
      <section class="auth-panel">
        <div>
          <p class="eyebrow">A small reset</p>
          <h1>Find your<br /><em>way back.</em></h1>
          <p>Enter your email and we will send you a reset link.</p>
        </div>
        <form class="auth-form" novalidate>
          <label
            >Email address<input type="email" name="email" required /></label
          ><button class="btn btn-dark" type="submit">Send reset link</button>
          <p class="form-message"></p>
        </form>
        <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>

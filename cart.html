<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Bag | Kalaah</title>
    <link rel="icon" type="image/svg+xml" href="images/kalaah-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600,700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="cart">
    <div data-site-header></div>
    <main class="cart-page section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Your selected pieces</p>
          <h1>Shopping bag</h1>
        </div>
        <a href="collections.html" class="text-link"
          >Continue shopping <i class="fa-solid fa-arrow-right"></i
        ></a>
      </div>
      <div class="cart-layout">
        <section class="cart-items"></section>
        <aside class="order-summary">
          <h3>Order summary</h3>
          <div><span>Subtotal</span><strong class="subtotal"></strong></div>
          <div><span>Shipping</span><strong class="shipping"></strong></div>
          <div class="total-row">
            <span>Total</span><strong class="total"></strong>
          </div>
          <button class="btn btn-dark checkout" type="button">
            Proceed to checkout
          </button>
          <p class="checkout-note">
            <i class="fa-solid fa-lock"></i> Secure checkout
          </p>
        </aside>
      </div>
    </main>
    <div data-site-footer></div>
    <div data-modal></div>
    <script src="app.js"></script>
  </body>
</html>

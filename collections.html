<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collections | Kalaah</title>
    <link rel="icon" type="image/svg+xml" href="images/kalaah-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="collections">
    <div data-site-header></div>
    <main class="shop-page">
      <div class="page-intro">
        <p class="eyebrow">The complete edit</p>
        <h1>Collections</h1>
        <p>Pieces chosen to be worn, remembered and made entirely yours.</p>
      </div>
      <div class="shop-layout">
        <aside class="filters">
          <button class="filter-close" aria-label="Close filters">
            <i class="fa-solid fa-xmark"></i>
          </button>
          <div class="filter-title">
            <span>Filters</span><button class="clear-filters">Clear all</button>
          </div>
          <div class="filter-group">
            <button class="filter-group-title">
              Category <i class="fa-solid fa-plus"></i>
            </button>
            <div class="filter-options" data-filter="category"></div>
          </div>
          <div class="filter-group">
            <button class="filter-group-title">
              Size <i class="fa-solid fa-plus"></i>
            </button>
            <div class="filter-options chips" data-filter="size"></div>
          </div>
          <div class="filter-group">
            <button class="filter-group-title">
              Colour <i class="fa-solid fa-plus"></i>
            </button>
            <div class="filter-options colors" data-filter="color"></div>
          </div>
        </aside>
        <section class="catalog">
          <div class="catalog-toolbar">
            <button class="filter-trigger">
              <i class="fa-solid fa-sliders"></i> Filter</button
            ><span class="product-total"></span
            ><label
              >Sort by
              <select class="sort-select">
                <option value="newest">Newest</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
              </select></label
            >
          </div>
          <div class="product-grid catalog-products"></div>
          <nav class="pagination" aria-label="Pagination"></nav>
        </section>
      </div>
    </main>
    <div data-site-footer></div>
    <div data-modal></div>
    <script src="app.js"></script>
  </body>
</html>
